<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>说悄悄话 - 丁浩睿</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #1e293b;
        }

        .back-btn {
            position: fixed;
            top: 30px;
            left: 30px;
            width: 44px;
            height: 44px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            text-decoration: none;
            color: #0a499d;
            box-shadow: 0 4px 12px rgba(10,73,157,0.1);
        }

        .memo-container {
            max-width: 800px;
            margin: 100px auto 50px;
            padding: 0 20px;
        }

        .memo-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(10,73,157,0.1);
            padding: 30px;
        }

        .memo-title {
            font-size: 28px;
            font-weight: 700;
            color: #0a499d;
            margin-bottom: 20px;
            text-align: center;
        }

        .text-area {
            width: 100%;
            min-height: 200px;
            padding: 16px;
            border: 1px solid rgba(10,73,157,0.15);
            border-radius: 12px;
            font-size: 18px;
            resize: vertical;
            background: #f8fafc;
            outline: none;
        }

        .word-count {
            text-align: right;
            margin-top: 8px;
            font-size: 14px;
            color: #64748b;
        }

        .upload-title {
            font-size: 18px;
            font-weight: 600;
            margin: 25px 0 15px;
            color: #334155;
        }

        .upload-area {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 15px;
        }

        .upload-item {
            height: 80px;
            border-radius: 8px;
            border: 2px dashed rgba(10,73,157,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            background: #f8fafc;
        }

        .upload-item input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .upload-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .submit-btn {
            width: 100%;
            height: 56px;
            background: #0a499d;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            margin-top: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #083a7f;
        }

        .success-tip {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            background: #0a499d;
            color: white;
            padding: 16px 32px;
            border-radius: 8px;
            display: none;
            z-index: 999;
        }
    </style>
</head>
<body>

<a href="index.html" class="back-btn">←</a>

<div class="memo-container">
    <div class="memo-card">
        <h2 class="memo-title">写下想对我说的悄悄话</h2>
        <textarea class="text-area" placeholder="最多1000字..." maxlength="1000" id="memoText"></textarea>
        <div class="word-count" id="wordCount">0/1000</div>

        <div class="upload-title">上传图片（最多9张）</div>
        <div class="upload-area" id="uploadArea">
            <div class="upload-item" id="uploadBtn">
                <span>+</span>
                <input type="file" accept="image/*" multiple id="imageInput">
            </div>
        </div>

        <button class="submit-btn" id="submitBtn">发送悄悄话</button>
    </div>
</div>

<div class="success-tip" id="successTip">✅ 发送成功！</div>

<script>
    // 已填入你的真实信息
    const GITHUB_TOKEN = "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";
    const GIST_ID = "9ec855ae71f4e7db556403a4a9923cad";

    // 字数统计
    const memoText = document.getElementById('memoText');
    const wordCount = document.getElementById('wordCount');
    memoText.addEventListener('input', () => {
        wordCount.textContent = `${memoText.value.length}/1000`;
    });

    // 图片上传
    const imageInput = document.getElementById('imageInput');
    const uploadArea = document.getElementById('uploadArea');
    const uploadBtn = document.getElementById('uploadBtn');
    let images = [];

    imageInput.addEventListener('change', e => {
        let files = e.target.files;
        let max = 9 - images.length;
        for(let i=0; i<Math.min(files.length, max); i++) {
            let f = files[i];
            let item = document.createElement('div');
            item.className = 'upload-item';
            let img = document.createElement('img');
            img.src = URL.createObjectURL(f);
            item.appendChild(img);
            uploadArea.insertBefore(item, uploadBtn);
            images.push(f);
        }
        if(images.length >=9) uploadBtn.remove();
        imageInput.value = '';
    });

    // 提交
    document.getElementById('submitBtn').onclick = async () => {
        let text = memoText.value.trim();
        if(!text && images.length===0) { alert('请输入内容或上传图片'); return; }

        let imgList = [];
        for(let f of images) {
            imgList.push(await toBase64(f));
        }

        let msg = {
            id: Date.now(),
            text: text,
            images: imgList,
            time: new Date().toLocaleString('zh-CN')
        };

        let res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
            headers: { Authorization: `token ${GITHUB_TOKEN}` }
        });
        let data = await res.json();
        let list = JSON.parse(data.files['whispers.json'].content || '[]');
        list.push(msg);

        await fetch(`https://api.github.com/gists/${GIST_ID}`, {
            method: 'PATCH',
            headers: {
                Authorization: `token ${GITHUB_TOKEN}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                files: { 'whispers.json': { content: JSON.stringify(list, null, 2) } }
            })
        });

        document.getElementById('successTip').style.display = 'block';
        setTimeout(() => location.reload(), 2000);
    };

    function toBase64(file) {
        return new Promise(r => {
            let rdr = new FileReader();
            rdr.onload = e => r(e.target.result);
            rdr.readAsDataURL(file);
        });
    }
</script>
</body>
</html>
