<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写悄悄话</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: #f7f8fa;
            padding: 30px 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
            color: #222;
        }
        textarea {
            width: 100%;
            height: 160px;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 15px;
            font-size: 15px;
            resize: none;
            outline: none;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            height: 50px;
            background: #4e8aff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        #successTip {
            text-align: center;
            color: #00b42a;
            margin-top: 15px;
            display: none;
        }
        .success-shake {
            animation: shake 0.5s;
        }
        @keyframes shake {
            0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-5px)}
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>写下你的悄悄话</h1>
        <textarea id="content" placeholder="说点什么..."></textarea>
        <button onclick="send()">发送悄悄话</button>
        <div id="successTip">发送成功！</div>
    </div>

    <script>
        function send() {
            let text = document.getElementById("content").value.trim();
            if (!text) {
                alert("请输入内容");
                return;
            }

            let msg = {
                id: Date.now(),
                text: text,
                images: [],
                time: new Date().toLocaleString("zh-CN")
            };

            submitWhisper(msg);
        }

        async function submitWhisper(msg) {
            try {
                await fetch("https://haorui.xyz/api/whispers", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(msg)
                });

                document.body.classList.add("success-shake");
                setTimeout(() => {
                    document.body.classList.remove("success-shake");
                }, 500);
                document.getElementById("successTip").style.display = "block";
                setTimeout(() => location.reload(), 2000);
            } catch (e) {
                alert("发送失败，请重试");
            }
        }
    </script>
</body>
</html>
