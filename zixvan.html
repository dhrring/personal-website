<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我们的故事 · Since 2022.09.01</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='6' width='22' height='22' rx='5' fill='%230a499d'/%3E%3Ccircle cx='16' cy='17' r='6' fill='%237db8ff'/%3E%3C/svg%3E">
<style>
/* ============ 现代深蓝变量 ============ */
:root{
  --navy:#0a499d; --navy-2:#0f5cc2; --navy-deep:#07356f;
  --sky:#7db8ff; --white:#fff;
  --pop:cubic-bezier(.16,1.12,.3,1);
  --out:cubic-bezier(.22,1,.36,1);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--navy)}
body{font-family:var(--sans);color:var(--white);overflow:hidden;-webkit-font-smoothing:antialiased}

/* ============ 首屏深蓝屏风 ============ */
.splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;
  background:radial-gradient(125% 125% at 50% 8%,var(--navy-2),var(--navy) 46%,var(--navy-deep) 100%);
  transition:opacity .6s ease,transform .6s ease}
.splash.out{opacity:0;transform:scale(1.05);pointer-events:none}
.splash .rise{opacity:0;transform:translateY(18px)}
.splash .r1{animation:rise .7s var(--out) .2s forwards}
.splash .r2{animation:rise .7s var(--out) .44s forwards}
.splash .r3{animation:rise .7s var(--out) .6s forwards}
.splash .r4{animation:rise .7s var(--out) .95s forwards}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
.since{font-size:13px;letter-spacing:5px;color:var(--sky);margin-bottom:22px}
.splash-lead{font-size:clamp(16px,4.4vw,22px);font-weight:500;letter-spacing:2px;color:rgba(255,255,255,.86)}
.splash-days{display:flex;align-items:baseline;justify-content:center;margin-top:8px}
.splash-days .num{font-size:clamp(96px,27vw,208px);font-weight:800;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.splash-days .unit{font-size:clamp(26px,7vw,50px);font-weight:700;margin-left:10px;color:var(--sky)}
.splash-load{position:absolute;left:0;right:0;bottom:calc(32px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:10px}
.loadbar{width:min(62vw,260px);height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.loadbar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--sky),#fff);transition:width .3s ease}
.loadtxt{font-size:12px;letter-spacing:2px;color:rgba(255,255,255,.72)}

/* ============ 播放舞台 ============ */
.reel{position:fixed;inset:0;background:var(--navy)}
.shot,.ending{position:absolute;inset:0;overflow:hidden;
  opacity:0;transform:translateY(100%) scale(1.06);will-change:transform,opacity}
.shot.active,.ending.active{opacity:1;transform:translateY(0) scale(1);
  transition:transform .62s var(--pop),opacity .4s ease}
.shot.leave,.ending.leave{opacity:0;transform:translateY(-42%) scale(.95);
  transition:transform .52s cubic-bezier(.5,0,.8,0),opacity .42s ease}

/* 照片 + 镜头运动 */
.shot-img{position:absolute;inset:0;overflow:hidden}
.shot-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transform:scale(1.14)}
.shot.active .shot-img img{opacity:1;transition:opacity .5s ease .05s}
.shot.active .kb-1{animation:kb1 2.5s linear .1s forwards}
.shot.active .kb-2{animation:kb2 2.5s linear .1s forwards}
.shot.active .kb-3{animation:kb3 2.5s linear .1s forwards}
.shot.active .kb-4{animation:kb4 2.5s linear .1s forwards}
.shot.active .kb-5{animation:kb5 2.5s linear .1s forwards}
@keyframes kb1{from{transform:scale(1.14) translate(-2.2%,0)}to{transform:scale(1.26) translate(2.2%,0)}}
@keyframes kb2{from{transform:scale(1.14) translate(2.2%,0)}to{transform:scale(1.26) translate(-2.2%,0)}}
@keyframes kb3{from{transform:scale(1.14) translate(0,-2.2%)}to{transform:scale(1.26) translate(0,2.2%)}}
@keyframes kb4{from{transform:scale(1.14) translate(0,2.2%)}to{transform:scale(1.26) translate(0,-2.2%)}}
@keyframes kb5{from{transform:scale(1.12)}to{transform:scale(1.25)}}

/* 底部标签（仅 RUI / VAN） */
.shot-meta{position:absolute;left:0;right:0;bottom:0;
  padding:0 26px calc(28px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:flex-start;gap:11px;
  background:linear-gradient(to top,rgba(7,53,111,.85) 10%,rgba(7,53,111,.46) 56%,transparent)}
.tag-line{height:3px;width:0;border-radius:3px;background:var(--sky)}
.shot.active .tag-line{animation:linegrow .55s var(--out) .22s forwards}
@keyframes linegrow{to{width:62px}}
.tag{font-size:clamp(40px,12.5vw,86px);font-weight:800;letter-spacing:3px;line-height:1;
  opacity:0;transform:translateY(26px);white-space:nowrap}
.shot.active .tag{animation:tagin .55s var(--pop) .3s forwards}
@keyframes tagin{to{opacity:1;transform:translateY(0)}}

/* ============ 结尾 ============ */
.ending{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:24px;text-align:center;
  background:radial-gradient(125% 125% at 50% 8%,var(--navy-2),var(--navy) 46%,var(--navy-deep) 100%)}
.end-days{font-size:clamp(18px,5vw,26px);font-weight:700;color:var(--sky);font-variant-numeric:tabular-nums;letter-spacing:1px}
.end-cn{font-size:clamp(28px,8vw,52px);font-weight:800;letter-spacing:4px}
.end-en{font-size:clamp(13px,3.4vw,16px);line-height:1.7;color:rgba(255,255,255,.72);max-width:86%;letter-spacing:.5px}

/* ============ 手机 / 矮屏优化 ============ */
@media (max-height:520px){
  .shot-meta{padding-bottom:calc(14px + env(safe-area-inset-bottom));gap:7px}
  .tag{font-size:clamp(28px,7vh,46px)}
  .splash-load{bottom:calc(14px + env(safe-area-inset-bottom))}
  .splash-days .num{font-size:clamp(70px,20vh,130px)}
}
/* ============ 低动效兜底 ============ */
@media (prefers-reduced-motion:reduce){
  .splash .rise{animation:none;opacity:1;transform:none}
  .shot,.ending{transition:opacity .3s ease;transform:none}
  .shot.active .shot-img img{animation:none;opacity:1;transform:scale(1.1)}
  .shot.active .tag,.shot.active .tag-line{animation:none;opacity:1;transform:none;width:62px}
}
</style>
</head>
<body>

<!-- ===== 首屏：大天数 + 预加载 ===== -->
<div class="splash" id="splash">
  <div class="since rise r1">SINCE&nbsp;&nbsp;2022.09.01</div>
  <div class="splash-lead rise r2">我们在一起，已经</div>
  <div class="splash-days rise r3">
    <span class="num" id="dayCount">0</span><span class="unit">天</span>
  </div>
  <div class="splash-load rise r4">
    <div class="loadbar"><i id="loadFill"></i></div>
    <div class="loadtxt" id="loadTxt">正在准备我们的回忆 0/16</div>
  </div>
</div>

<!-- ===== 自动剪辑舞台 ===== -->
<div class="reel" id="reel">

  <!-- 关于我 RUI -->
  <div class="shot">
    <div class="shot-img"><img class="kb-1" src="a1.jpg" alt="RUI"></div>
    <div class="shot-meta"><span class="tag-line"></span><span class="tag">RUI</span></div>
  </div>
  <div class="shot">
    <div class="shot-img"><img class="kb-2" src="a2.jpg" alt="RUI"></div>
    <div class="shot-meta"><span class="tag-line"></span><span class="tag">RUI</span></div>
  </div>
  <div class="shot">
    <div class="shot-img"><img class="kb-3" src="a3.jpg" alt="RUI"></div>
    <div class="shot-meta"><span class="tag-line"></span><span class="tag">RUI</span></div>
  </div>
  <div class="shot">
    <div class="shot-img"><img class="kb-4" src="a5.jpg" alt="RUI"></div>
    <div class="shot-meta"><span class="tag-line"></span><span class="tag">RUI</span></div>
  </div>
  <div class="shot">
    <div class="shot-img"><img class="kb-5" src="a6.jpg" alt="RUI"></div>
    <div class="shot-meta"><span class="tag-line"></span><span class="tag">RUI</span></div>
  </div>

  <!-- 关于你 VAN -->
  <div class="shot">
    <div class="shot-img"><img class="kb-1" src="b1.jpg" alt="VAN"></div>
    <div class="shot-meta"><span class="tag-line"></span><span class="tag">VAN</span></div>
  </div>
  <div class="shot">
    <div class="shot-img"><img class="kb-2" src="b2.jpg" alt="VAN"></div>
    <div class="shot-meta"><span class="tag-line"></span><span class="tag">VAN</span></div>
  </div>
  <div class="shot">
    <div class="shot-img"><img class="kb-3" src="b3.jpg" alt="VAN"></div>
    <div class="shot-meta"><span class="tag-line"></span><span class="tag">VAN</span></div>
  </div>
  <div class="shot">
    <div class="shot-img"><img class="kb-4" src="b4.jpg" alt="VAN"></div>
    <div class="shot-meta"><span class="tag-line"></span><span class="tag">VAN</span></div>
  </div>
  <div class="shot">
    <div class="shot-img"><img class="kb-5" src="b5.jpg" alt="VAN"></div>
    <div class="shot-meta"><span class="tag-line"></span><span class="tag">VAN</span></div>
  </div>
  <div class="shot">
    <div class="shot-img"><img class="kb-1" src="b6.jpg" alt="VAN"></div>
    <div class="shot-meta"><span class="tag-line"></span><span class="tag">VAN</span></div>
  </div>

  <!-- 我们 RUI × VAN -->
  <div class="shot">
    <div class="shot-img"><img class="kb-2" src="c1.jpg" alt="RUI VAN"></div>
    <div class="shot-meta"><span class="tag-line"></span><span class="tag">RUI&nbsp;&times;&nbsp;VAN</span></div>
  </div>
  <div class="shot">
    <div class="shot-img"><img class="kb-3" src="c2.jpg" alt="RUI VAN"></div>
    <div class="shot-meta"><span class="tag-line"></span><span class="tag">RUI&nbsp;&times;&nbsp;VAN</span></div>
  </div>
  <div class="shot">
    <div class="shot-img"><img class="kb-4" src="c3.jpg" alt="RUI VAN"></div>
    <div class="shot-meta"><span class="tag-line"></span><span class="tag">RUI&nbsp;&times;&nbsp;VAN</span></div>
  </div>
  <div class="shot">
    <div class="shot-img"><img class="kb-5" src="c4.jpg" alt="RUI VAN"></div>

  </div>

  </div>

  <!-- 结尾 -->
  <div class="ending" id="ending">
    <div class="end-days" id="endDays">0 天</div>
    <div class="end-cn">相逢有时，来日方长</div>
    <div class="end-en">We meet for a reason, and there is always tomorrow.</div>
  </div>

</div>

<script>
(function(){
  "use strict";
  var START=new Date(2022,8,1,0,0,0);
  var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var SHOT_DUR=2500, END_DUR=3400, SPLASH_MIN=2600;

  var splash=document.getElementById("splash");
  var dayNum=document.getElementById("dayCount");
  var loadFill=document.getElementById("loadFill"), loadTxt=document.getElementById("loadTxt");
  var reel=document.getElementById("reel");
  var shots=Array.prototype.slice.call(reel.querySelectorAll(".shot"));
  var ending=document.getElementById("ending");
  var playItems=shots.concat([ending]);
  function durOf(el){ return el.classList.contains("ending")?END_DUR:SHOT_DUR; }

  /* ===== 相识天数 ===== */
  var target=Math.floor((Date.now()-START.getTime())/86400000);
  if(reduce){
    dayNum.textContent=target.toLocaleString();
  }else{
    var t0=performance.now();
    (function tw(now){
      var p=Math.min(1,(now-t0)/1400), eased=1-Math.pow(1-p,3);
      dayNum.textContent=Math.round(target*eased).toLocaleString();
      if(p<1) requestAnimationFrame(tw);
    })(t0);
  }
  document.getElementById("endDays").textContent=target.toLocaleString()+" 天";

  /* ===== 图片预加载 ===== */
  var imgs=shots.map(function(s){ return s.querySelector("img"); });
  var total=imgs.length, done=0, ready=false, readyAt=0;
  imgs.forEach(function(im){
    var probe=new Image();
    probe.onload=probe.onerror=function(){
      done++;
      var pct=Math.round(done/total*100);
      loadFill.style.width=pct+"%";
      loadTxt.textContent="正在准备我们的回忆 "+done+"/"+total;
      if(done===total){
        ready=true; readyAt=performance.now();
        loadTxt.textContent="故事即将开始";
      }
    };
    probe.src=im.src;
  });

  /* ===== 切换（垂直弹性） ===== */
  var idx=0, elapsed=0, last=performance.now(), phase="splash";
  var splashStart=performance.now();
  function goTo(i){
    var cur=playItems[idx];
    cur.classList.remove("active");
    cur.classList.add("leave");
    setTimeout(function(){ cur.classList.remove("leave"); },620);
    idx=(i+playItems.length)%playItems.length;
    playItems[idx].classList.add("active");
    elapsed=0;
  }

  /* ===== 主时钟 ===== */
  function frame(now){
    var dt=now-last; last=now;
    if(phase==="splash"){
      var shown=now-splashStart;
      if(ready && shown>=SPLASH_MIN && now>=readyAt+300){
        phase="play";
        splash.classList.add("out");
        playItems[0].classList.add("active");
        setTimeout(function(){ splash.style.display="none"; },660);
      }
    }else{
      elapsed+=dt;
      if(elapsed>=durOf(playItems[idx])) goTo(idx+1);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
