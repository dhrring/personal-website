<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>丁浩睿 - 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #1e293b;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .profile-section {
            margin: 60px auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards 0.2s;
        }

        .profile-left {
            flex: 1;
        }

        .name-en {
            font-size: clamp(18px, 2vw, 22px);
            color: #0a499d;
            font-weight: 500;
        }

        .name-cn {
            font-size: clamp(32px, 5vw, 48px);
            font-weight: 700;
            margin: 5px 0 25px;
            color: #0a499d;
        }

        .info-item {
            font-size: clamp(16px, 2vw, 19px);
            margin: 12px 0;
            display: flex;
            align-items: center;
        }

        .info-title {
            width: clamp(80px, 10vw, 100px);
            font-weight: 600;
            color: #334155;
        }

        .info-content {
            color: #0a499d;
            font-weight: 600;
        }

        .highlight {
            position: relative;
            z-index: 0;
        }

        .highlight::after {
            content: "";
            position: absolute;
            bottom: 2px;
            left: 0;
            height: 8px;
            width: 100%;
            background: linear-gradient(90deg, rgba(10, 73, 157, 0.1), rgba(10, 73, 157, 0.2));
            z-index: -1;
            border-radius: 2px;
        }

        .big-text {
            font-size: clamp(24px, 3vw, 32px);
            font-weight: 600;
            margin-top: 40px;
            color: #334155;
        }

        .profile-right {
            width: clamp(200px, 30vw, 280px);
            height: clamp(260px, 40vw, 370px);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(10, 73, 157, 0.15);
        }

        .profile-right img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .account-section {
            margin: 0 auto 80px;
            padding: 0 20px;
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards 0.5s;
        }

        .section-title {
            font-size: clamp(28px, 4vw, 36px);
            font-weight: 700;
            text-align: center;
            margin-bottom: 40px;
            color: #0a499d;
        }

        .grid-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
        }

        .grid-item {
            background: #ffffff;
            border: 1px solid rgba(10, 73, 157, 0.1);
            border-radius: 16px;
            height: clamp(180px, 25vw, 220px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #1e293b;
        }

        .grid-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(10, 73, 157, 0.12);
        }

        .grid-item img {
            width: clamp(60px, 8vw, 70px);
            height: clamp(60px, 8vw, 70px);
            border-radius: 12px;
            margin-bottom: 16px;
            object-fit: cover;
        }

        .grid-item h3 {
            font-size: clamp(18px, 2.5vw, 22px);
            font-weight: 600;
            color: #0a499d;
        }

        .whisper-section {
            margin: 0 auto 100px;
            padding: 0 20px;
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards 0.6s;
        }

        .whisper-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            height: clamp(60px, 10vw, 80px);
            background: #0a499d;
            color: white;
            text-align: center;
            line-height: clamp(60px, 10vw, 80px);
            border-radius: 16px;
            text-decoration: none;
            font-size: clamp(18px, 3vw, 24px);
            font-weight: 600;
            margin: 0 auto;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(10, 73, 157, 0.2);
        }

        .whisper-btn:hover {
            transform: translateY(-3px);
            background: #083a7f;
        }

        @media (max-width: 768px) {
            .profile-section {
                flex-direction: column;
                text-align: center;
            }
            .info-item {
                justify-content: center;
            }
            .grid-box {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="profile-section container">
    <div class="profile-left">
        <div class="name-en">Ding Haorui</div>
        <div class="name-cn">丁浩睿</div>

        <div class="info-item">
            <div class="info-title">出生日期</div>
            <div class="info-content highlight">和我同一天</div>
        </div>
        <div class="info-item">
            <div class="info-title">年龄</div>
            <div class="info-content highlight">和我一样大</div>
        </div>
        <div class="info-item">
            <div class="info-title">住址</div>
            <div class="info-content highlight">我家</div>
        </div>
        <div class="info-item">
            <div class="info-title">单位</div>
            <div class="info-content highlight">河南大学附属中学</div>
        </div>

        <div class="big-text">好像确实没有什么可以写的😂</div>
    </div>

    <div class="profile-right">
        <img src="avatar.jpg" alt="头像">
    </div>
</div>

<div class="account-section container">
    <div class="section-title">我的账号</div>
    <div class="grid-box">
        <a href="messaging.html" class="grid-item">
            <img src="messaging.png" alt="通讯">
            <h3>通讯</h3>
        </a>
        <a href="games.html" class="grid-item">
            <img src="games.png" alt="游戏">
            <h3>游戏</h3>
        </a>
        <a href="social.html" class="grid-item">
            <img src="social.png" alt="社交">
            <h3>社交</h3>
        </a>
        <a href="opensource.html" class="grid-item">
            <img src="opensource.png" alt="开源平台">
            <h3>开源平台</h3>
        </a>
    </div>
</div>

<!-- 悄悄话入口 -->
<div class="whisper-section container">
    <div class="section-title">为我留言</div>
    <a href="whisper.html" class="whisper-btn">💬 说悄悄话给我</a>
</div>

</body>
</html>
